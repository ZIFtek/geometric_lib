name: Unit Tests

on:
  push:
    branches: [ "new_features_501689" ]
  pull_request:
    branches: [ "new_features_501689" ]

  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Updates pip
      run: |
        python -m pip install --upgrade pip

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -v